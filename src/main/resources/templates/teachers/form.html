<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Öğretmen Formu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: topbar('teachers')}"></div>

<div class="container">
    <div class="page-header">
        <div>
            <h1 th:text="${isEdit} ? 'Öğretmen Düzenle' : 'Öğretmen Ekle'">Öğretmen Ekle</h1>
        </div>
    </div>

    <div class="form-card">
        <form th:action="${isEdit} ? @{/teachers/edit/{no}(no=${teacher.teacherNumber})} : @{/teachers}"
              th:object="${teacher}" method="post">

            <div class="form-row">
                <div class="form-group">
                    <label>Kimlik No (ID)</label>
                    <input type="number" th:field="*{id}" required>
                </div>
                <div class="form-group">
                    <label>Öğretmen No</label>
                    <input type="number" th:field="*{teacherNumber}" th:readonly="${isEdit}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Ad</label>
                    <input type="text" th:field="*{name}" required>
                </div>
                <div class="form-group">
                    <label>Soyad</label>
                    <input type="text" th:field="*{surname}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="text" th:field="*{password}" required>
                </div>
                <div class="form-group">
                    <label>Branş</label>
                    <input type="text" th:field="*{branch}" required>
                </div>
            </div>

            <div class="form-group">
                <label>Maaş</label>
                <input type="number" step="0.01" th:field="*{salary}" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Kaydet</button>
                <a class="btn btn-outline" th:href="@{/teachers}">İptal</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
