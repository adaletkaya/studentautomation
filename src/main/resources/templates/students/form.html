<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Öğrenci Formu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: topbar('students')}"></div>

<div class="container">
    <div class="page-header">
        <div>
            <h1 th:text="${isEdit} ? 'Öğrenci Düzenle' : 'Öğrenci Ekle'">Öğrenci Ekle</h1>
        </div>
    </div>

    <div class="form-card">
        <form th:action="${isEdit} ? @{/students/edit/{no}(no=${student.studentNumber})} : @{/students}"
              th:object="${student}" method="post">

            <div class="form-row">
                <div class="form-group">
                    <label>Kimlik No (ID)</label>
                    <input type="number" th:field="*{id}" required>
                </div>
                <div class="form-group">
                    <label>Öğrenci No</label>
                    <input type="number" th:field="*{studentNumber}" th:readonly="${isEdit}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Ad</label>
                    <input type="text" th:field="*{name}" required>
                </div>
                <div class="form-group">
                    <label>Soyad</label>
                    <input type="text" th:field="*{surname}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="text" th:field="*{password}" required>
                </div>
                <div class="form-group">
                    <label>Bölüm</label>
                    <input type="text" th:field="*{department}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Sınıf</label>
                    <input type="number" th:field="*{gradeLevel}" required>
                </div>
                <div class="form-group">
                    <label>GPA</label>
                    <input type="number" step="0.01" min="0" max="4" th:field="*{gpa}" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Kaydet</button>
                <a class="btn btn-outline" th:href="@{/students}">İptal</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
